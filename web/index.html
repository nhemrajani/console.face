<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>console.face()</title>
  <link rel="stylesheet" href="css/show.css" />
</head>
<body>
  <!-- 1. paste a playlist -->
  <section id="start" class="screen">
    <form id="form" autocomplete="off">
      <input id="link" type="url" placeholder="paste a spotify playlist link" aria-label="Spotify playlist link" spellcheck="false" />
      <button type="submit" aria-label="Draw">→</button>
    </form>
    <p class="error" id="error" role="alert"></p>
  </section>

  <!-- 2. loading -->
  <section id="loading" class="screen" hidden>
    <div class="pencil"><span></span></div>
  </section>

  <!-- 3. the iPod and the faces -->
  <section id="show" hidden>
    <div class="ipod" aria-label="Playlist">
      <div class="lcd">
        <div class="lcd-head"><span class="play">▶</span><span id="lcd-title"></span><span class="batt"></span></div>
        <ol id="tracks"></ol>
        <div class="lcd-bar"><span id="lcd-progress"></span></div>
      </div>
      <div class="wheel">
        <span class="menu">MENU</span>
        <span class="prev">⏮</span>
        <span class="next">⏭</span>
        <span class="pp">⏯</span>
        <div class="hub"></div>
      </div>
    </div>
    <div id="crowd" class="crowd"></div>
  </section>

  <!-- one face, big -->
  <div id="big" class="big" hidden>
    <button class="close" id="close" aria-label="Close">×</button>
    <svg id="big-svg"></svg>
  </div>

  <script type="module" src="js/show.js"></script>
</body>
</html>
